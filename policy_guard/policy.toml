decision = "allow"
priority = 800

[[rule]]
toolName = "list_directory"
decision = "allow"
priority = 800

[[rule]]
toolName = "glob"
decision = "allow"
priority = 800

[[rule]]
toolName = "search_file_content"
decision = "allow"
priority = 800

