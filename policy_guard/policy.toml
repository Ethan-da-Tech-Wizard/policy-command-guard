denyMessage = "Blocked: '..' path traversal. Use paths inside the workspace."

# file tools: more secret paths (read side and path keys)
[[rule]]
toolName = ["read_file", "read_many_files", "list_directory", "glob", "search_file_content", "grep_search", "write_file", "replace"]
argsPattern = '\x00"(?:file_path|dir_path|path|paths|include|pattern|exclude|directory)":[^\x00]*(?:\.env(?:\.(?:local|production|prod|development|staging|secret|secrets)|)(?![A-Za-z0-9_.])|\.codex|\.pgpass|/etc/ssl/private|/etc/(?:passwd-|shadow|gshadow|sudoers|polkit-1|crypttab|ssh|wireguard|openvpn|NetworkManager/system-connections)|/proc/(?:[^ \"\x27\\]*/|)(?:environ|mem|maps|cmdline|root|cwd|fd|exe|stack|syscall|mountinfo)|\.mozilla|google-chrome|chromium|BraveSoftware|\.password-store|\.vault-token|\.local/share/keyrings|\.pypirc|\.terraform\.d|\.azure|\.boto|\.s3cfg|\.config/rclone|\.huggingface|\.cache/huggingface|\.ollama|\.openai|\.anthropic|\.git/config|\.git/credentials|(?<![A-Za-z0-9_.-])credentials(?:\.json|)[ \"\x27\\]|(?<![A-Za-z0-9_])tokens?\.(?:json|txt|yaml|yml)|(?<![A-Za-z0-9_])secrets?\.(?:json|ya?ml|toml|env)|\.ppk|\.pfx|\.kdbx|private[_-]?key|Login Data|(?<![A-Za-z0-9_])Cookies[ \"\x27\\]|\.config/[^ \"\x27\\]*(?:token|secret|credential|auth)|\.local/share/[^ \"\x27\\]*(?:token|secret|credential))'
decision = "deny"
priority = 900
denyMessage = "Blocked: this path holds credentials or secrets. Ask Ethan to run this himself if it is really needed."

# file tools: private data directories
[[rule]]
toolName = ["read_file", "read_many_files", "list_directory", "glob", "search_file_content", "grep_search", "write_file", "replace"]
argsPattern = '\x00"(?:file_path|dir_path|path|paths|include|exclude|directory)":[^\x00]*(?:"|[ \"=]|\./|workspace/)(?:profile|business|grants|apply|backups|\.evidence|private|Company_Documents|receipts|invoices|clients|\.stversions|exports|data/sessions|data/session_archive|data/malakopia)(?:/|\"|$)'
decision = "deny"
priority = 900
denyMessage = "Blocked: this folder holds private data (profile, business, grants, backups, evidence). Ask Ethan to run this himself if it is really needed."

# file tools: private data directories in a glob pattern (slash form only; a bare word is a search term)
[[rule]]
toolName = ["read_file", "read_many_files", "list_directory", "glob", "search_file_content", "grep_search", "write_file", "replace"]
argsPattern = '\x00"pattern":"(?:[^\x00]*(?:[ =]|\./|\*/|workspace/|)|)(?:profile|business|grants|apply|backups|\.evidence|private|Company_Documents|receipts|invoices|clients|\.stversions|exports|data/sessions|data/session_archive|data/malakopia)/'
decision = "deny"
priority = 900
denyMessage = "Blocked: this folder holds private data (profile, business, grants, backups, evidence). Ask Ethan to run this himself if it is really needed."

# write tools: target must be an unprotected workspace file
[[rule]]
toolName = ["write_file", "replace"]
argsPattern = '\x00"file_path":"(?!(?:/(?:(?:home/[^/ \"\x27\\]+/workspace|Users/[^/ \"\x27\\]+/workspace)|(?:tmp|private/tmp|var/folders|private/var/folders))/|(?:\./|)[A-Za-z0-9_@+.-]))'
decision = "deny"
priority = 900
denyMessage = "Blocked: writing outside the workspace. Write only inside the workspace."

# write tools: protected targets
[[rule]]
toolName = ["write_file", "replace"]
argsPattern = '\x00"file_path":"[^"\x00]*(?:(?<![A-Za-z0-9_.-])(?:[Aa][Gg][Ee][Nn][Tt][Ss]\.[Mm][Dd]|[Cc][Ll][Aa][Uu][Dd][Ee]\.[Mm][Dd]|[Gg][Ee][Mm][Ii][Nn][Ii]\.[Mm][Dd]|\.[Gg][Ee][Mm][Ii][Nn][Ii](?:/|[ \"\x27\\])|\.[Gg][Ii][Tt](?:/|[ \"\x27\\])|\.[Cc][Oo][Dd][Ee][Xx]|\.[Cc][Ll][Aa][Uu][Dd][Ee]|\.ssh|\.aws|\.gnupg|\.config|\.bashrc|\.bash_profile|\.profile|\.zshrc|\.zprofile|\.zshenv|\.pam_environment|\.xinitrc|\.local/share|ethan(?:[ \"\x27\\]|$)|archive/[^ \"\x27\\]*policy)|[Ee][Tt][Hh][Aa][Nn]_[A-Za-z_]*(?:gemini_policy|policy|guard|alarm|capped_run|sandbox|admin)[A-Za-z_.]*|[Ee][Tt][Hh][Aa][Nn]_[Kk][Nn][Oo][Ww]\.py|policy_(?:bypass_suite|heldout)\.json|check_all_(?:latest\.json|history[A-Za-z._-]*\.jsonl)|[A-Za-z0-9_@-]+\.(?:service|timer|socket|path|mount|plist)(?:[ \"\x27\\]|$)|systemd|LaunchAgents|LaunchDaemons)'
decision = "deny"
priority = 900
denyMessage = "Blocked: this path is protected (policy, guards, instruction files, .gemini, .git, startup files, service units)."

# model memory persistence
[[rule]]
toolName = ["save_memory"]
decision = "deny"
priority = 900
denyMessage = "Blocked: persistent memory writes are not allowed from the local model."

# --- allow-all shell (user tier): makes the engine split the command with its tree-sitter bash parser and re-check
# every sub-command against all deny rules above; a parse error is DENY.  Everything dangerous was denied above.
[[rule]]
toolName = ["run_shell_command", "ShellTool"]
argsPattern = '^\{\x00"command":"'
decision = "allow"
priority = 800
allowRedirection = true

# END GENERATED ALLOWLIST

# --- allow: ordinary file work inside the sandboxed session just goes ---
# Ethan directed full auto (2026-10-25): no approval prompts for routine file work.
# This stays safe without the prompt because the outer sandbox confines writes to
# the workspace, every deny above sits at higher priority inside the elevated
# admin snapshot, and results land on an isolated guarded git task branch.
[[rule]]
toolName = "write_file"
decision = "allow"
priority = 800

[[rule]]
toolName = "replace"
decision = "allow"
priority = 800

[[rule]]
toolName = "read_file"
decision = "allow"
priority = 800

[[rule]]
