[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Core metadata. Python >= 3.10 is required (see requires-python below); the engine itself uses only the standard library.
[project]
name = "policy-command-guard"
version = "1.0.0"
description = "Python tool for evaluating shell command strings against a policy."
readme = "README.md"
authors = [
  { name = "Ethan-da-Tech-Wizard", email = "noreply@users.noreply.github.com" }
]
license = { text = "MIT" }
# Trove classifiers: audience, topic, supported Python versions; POSIX platforms only because the guard models POSIX shell syntax.
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]
# Search keywords for package indexes (no effect on behaviour).
keywords = [
  "security",
  "policy-as-code",
  "command-guard",
  "shell-security",
  "zero-trust",
  "adversarial-defense",
  "ast-tokenization",
  "least-privilege"
]
requires-python = ">=3.10"
dependencies = []

# Extras: `pip install .[dev]` adds the test runner and the linter that CI runs (`ruff check .`).
[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.1.0",
]

# Console commands: `policy-guard` evaluates a command string; `run-benchmark` runs the 565-case adversarial benchmark.
[project.scripts]
policy-guard = "policy_guard.cli:main"
run-benchmark = "benchmark.run_benchmark:main"

# Ship only the policy_guard and benchmark packages; scripts/ and tests/ stay in the repo.
[tool.setuptools.packages.find]
where = ["."]
include = ["policy_guard*", "benchmark*"]


# Ruff lint settings mirrored in CI: 120-column limit, pycodestyle (E), pyflakes (F) and warnings (W) rules. E501 (long lines)
# and E402 (imports after sys.path edits, needed by the scripts/tests) are ignored on purpose.
[tool.ruff]
line-length = 120
lint.select = ["E", "F", "W"]
lint.ignore = ["E501", "E402"]
