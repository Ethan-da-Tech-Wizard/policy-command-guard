toolName = "run_shell_command"
argsPattern = '("command":"|\\n|[;&(`{]|(?<!\{\x00"command":"[^\x27\\"]*\b(grep|egrep|fgrep|rg|ag|ack)( +-[^\s\x27\\"]+|)( +-[^\s\x27\\"]+|)( +-[^\s\x27\\"]+|)( +-[^\s\x27\\"]+|) +(-e +|)(\x27|\\")[^\s\x27\\"]+)\||\$\(|(\S*/|)(sh|bash|zsh|dash|ksh) +-\w*c +(\\"|\x27|))\s*(\w+=\S* |)(\w+=\S* |)(env |command |exec |nohup |setsid |time |nice |xargs |stdbuf |builtin |then |do |else |busybox |watch |parallel |unbuffer |chronic |timeout \S+ |timeout -\S+ \S+ |nice -n \S+ |nice -\S+ |ionice -c\S+ |ionice -c \S+ |flock \S+ |xargs -\S+ \S+ |xargs -\S+ |env -\S+ |env -\S+ \S+ |)(env |command |exec |nohup |setsid |time |nice |xargs |stdbuf |builtin |then |do |else |busybox |watch |parallel |unbuffer |chronic |timeout \S+ |timeout -\S+ \S+ |nice -n \S+ |nice -\S+ |ionice -c\S+ |ionice -c \S+ |flock \S+ |xargs -\S+ \S+ |xargs -\S+ |env -\S+ |env -\S+ \S+ |)(\w+=\S* |)([^\s;&|()`"]*/|\\\\|\\"|\x27|)(rm|rmdir|unlink|shred|truncate|dd|mkfs(\.\w+|)|wipefs|fdisk|sfdisk|parted|mkswap|chattr|srm|blkdiscard)(?=[\s;&|)`"\\\x27]|$)'
