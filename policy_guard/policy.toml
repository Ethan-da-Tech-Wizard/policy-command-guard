# --- shell ALLOWLIST (2026-11-01 redesign) ---
# The deny list above was provably incomplete (independent verifier: 94 of 145 bypass attempts allowed).  Shell is now
# allowlist-by-default: the generated block below denies every command that is not inside a strict grammar and then
# allows (so the engine re-checks each pipe/&& sub-command).  The older deny rules above stay as defense in depth and
# because their denyMessage text is embedded in refusal training rows.  Edit scripts/ethan_policy_gen.py, not the block.
# BEGIN GENERATED ALLOWLIST (scripts/ethan_policy_gen.py) - do not edit by hand
# Primary control: deny-only negative lookaheads (see scripts/ethan_policy_gen.py docstring).
# Guarded git commands the grammar allows: "ethan git status" "ethan git begin" "ethan git stage" "ethan git verify" "ethan git finish" "ethan git undo-last"

# args must start with the command key (extra keys sorted before it would hide it from the anchored rules)
[[rule]]
toolName = ["run_shell_command", "ShellTool"]
argsPattern = '^(?!\{\x00"command":")'
decision = "deny"
priority = 900
denyMessage = "Blocked: malformed shell call."

# first word must be an allowlisted read-only/workspace command
[[rule]]
toolName = ["run_shell_command", "ShellTool"]
argsPattern = '^\{\x00"command":"(?!(?:(?:env |)(?:FOO|BAR|BAZ|LC_ALL|LANG|TZ|NO_COLOR|CI|PYTHONDONTWRITEBYTECODE|PYTHONUNBUFFERED)=[A-Za-z0-9_.-]* |)(?:ls|cat|head|tail|wc|tree|stat|file|pwd|echo|printf|sort|uniq|cut|tr|nl|diff|cmp|du|df|ps|date|whoami|uname|which|basename|dirname|realpath|sha256sum|md5sum|seq|sleep|true|false|nproc|free|uptime|grep|egrep|fgrep|rg|find|jq|tar|git|python3|pip|pip3|node|ethan|sed|awk|xargs|cd|mkdir|touch|cp|mv|chmod|pytest|make|npm|nvidia-smi|scripts/ethan_capped_run\.sh)(?: |"))'
