# Ethan CLI shell policy for Gemini CLI (loaded with --policy by `ethan chat`).
# YOLO auto-approves ordinary tools in the trusted coding session. Gemini's policy
# launcher elevates a validated deny-only snapshot above caller user policies.
# macOS strict-open permits workspace/tmp/cache/includes writes, broader system
# and selected home reads, and outbound network. It is not workspace-only or
# network-denying isolation. Upstream tainted-input checks can require review.
# Keep irreversible/system-wide operations denied.
#
# 2026-11-01 REDESIGN: shell is ALLOWLIST-BY-DEFAULT.  The pre-existing deny list (kept below, unchanged, as defense in
# depth and for its denyMessage text) let 94 of 145 independently crafted bypasses through.  The generated block near
# the end of this file (scripts/ethan_policy_gen.py) denies every shell command that is not inside a strict grammar
# (first word allowlisted; no substitution / redirection / chaining / globs / quote tricks; fixed git, python -c, sed,
# awk, find, xargs, tar, pip grammars; workspace-only, unprotected, non-secret paths) and then allows, so the engine
# re-checks each ' | ' / ' && ' sub-command.  File tools: workspace-relative paths only, protected files unwritable.
# Regression: scripts/ethan_policy_bypass_suite.py (real PolicyEngine, user tier AND launcher admin-snapshot shape).
# Revert: cp archive/2026-11-01/policy-allowlist/ethan_gemini_policy.before.toml scripts/ethan_gemini_policy.toml

# --- allow: the Magi coordination actions Ethan asked to auto-approve ---
# Keep the permission narrow. Other tools exposed by the same MCP server
# cannot be selected by a plain `/magi` status request.
[[rule]]
mcpName = "magi"
toolName = "magi_cluster_status"
decision = "allow"
priority = 800

[[rule]]
mcpName = "magi"
toolName = "magi_inbox_poll"
decision = "allow"
priority = 800

[[rule]]
mcpName = "magi"
toolName = "magi_dispatch_task"
decision = "allow"
priority = 800

# --- hard deny: destructive, privileged, remote, or download-and-run ---
# NOTE (2026-11-01 fix): Gemini CLI 0.65.0 turns each commandPrefix into the regex
#   "command":"<prefix>  followed by (whitespace | quote)
# so a prefix that itself ends in a space ("rm ", "su ", "nc ") can never match
# "rm -rf x" and a prefix like "mv /" can never match "mv /etc/x". Prefixes below
# therefore carry NO trailing whitespace. Anything that needs more than a start-of-
# command match (wrappers, paths, chains, secrets) is an argsPattern regex further down.
# Gemini rejects regexes where a quantified group follows another group's quantifier,
# so those regexes use capturing groups with empty alternatives instead of (..)?.
# Lint: scripts/test_ethan_gemini_policy.py
[[rule]]
toolName = "run_shell_command"
commandPrefix = ["sudo", "su", "doas", "rm", "rmdir", "mkfs", "dd", "shred", "chmod -R", "chown -R",
  "curl", "wget", "ssh", "scp", "rsync", "nc", "git push", "git reset", "git clean", "pacman", "yay",
  "pip install", "npm install", "npm i", "systemctl", "shutdown", "reboot", "poweroff", "kill", "pkill", "killall",
  "git add", "git commit", "git switch", "git checkout", "git merge", "git branch -d", "git branch -D",
  "git stash", "git remote", "git worktree", "git cherry-pick", "git revert", "git update-ref",
  "git commit-tree", "git config", "git init", "git clone", "git fetch", "git pull", "git rm",
  "brew install", "brew upgrade", "brew uninstall", "pip3 install", "python3 -m pip",
  "python -m pip", "npm update", "npm uninstall", "npx",
  "launchctl", "osascript", "defaults write", "diskutil", "softwareupdate", "installer",
  "python3 -m unittest discover -s scripts", ":(){"]
decision = "deny"
priority = 900
denyMessage = "Blocked by the Ethan safety policy. Ask Ethan to run this himself if it is really needed."

# --- hard deny: regex rules (command position, wrappers, absolute paths, chains, secrets) ---
